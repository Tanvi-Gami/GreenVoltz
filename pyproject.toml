[project]
name = "greenvoltz"
version = "0.1.0"
description = "AI-powered EV charging orchestration platform based on PREDICT -> OPTIMISE -> RESERVE -> ADAPT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "lightgbm>=4.3.0",
    "scikit-learn>=1.4.0",
    "duckdb>=0.10.0",
    "pyarrow>=15.0.0",
    "workalendar>=17.0.0",
    "sqlalchemy>=2.0.28",
    "psycopg2-binary>=2.9.9",
    "ortools>=9.9.3963",
    "shap>=0.45.0",
    "httpx>=0.27.0",
    "joblib>=1.3.2",
    "scipy>=1.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "ruff>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "intelligence", "data_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
pythonpath = ["."]
addopts = "-v"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
